name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  research-index:
    # Fast, no build: a docs-only PR should not wait on a C++ toolchain to be
    # told its new research directory is missing from the experiment index.
    # See issue #22 -- the index drifted three times in one session and was
    # corrected by hand each time, which lasts until the next merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: research/README.md index matches the tree
        run: python3 research/check_index.py

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev libgrpc-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNANODB_BUILD_PYTHON=OFF -DNANODB_BUILD_SERVER=ON -DNANODB_BUILD_CLUSTER=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t nanodb:ci .

      - name: Build Distributed Docker image
        run: cd deploy && docker compose -f docker-compose.cluster.yml build
